apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-db
  template:
    metadata:
      labels:
        app: customer-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:lts
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: root
            - name: MARIADB_DATABASE
              value: customerDb
            - name: MARIADB_USER
              value: user
            - name: MARIADB_PASSWORD
              value: "123"
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: customer-db
spec:
  selector:
    app: customer-db
  ports:
    - port: 3306
      targetPort: 3306